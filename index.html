<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>무지개 분식</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game">
  <img src="game.png" id="board" alt="무지개 분식 게임 화면">

  <!-- 실제 게임 클릭 영역: 화면은 배경 사진 그대로 유지 -->
  <button class="hot order1" data-order="떡볶이" aria-label="떡볶이 주문"></button>
  <button class="hot order2" data-order="오뎅" aria-label="오뎅 주문"></button>
  <button class="hot order3" data-order="로제떡볶이" aria-label="로제떡볶이 주문"></button>
  <button class="hot order4" data-order="김말이" aria-label="김말이 주문"></button>
  <button class="hot order5" data-order="야채튀김" aria-label="야채튀김 주문"></button>
  <button class="hot order6" data-order="고구마튀김" aria-label="고구마튀김 주문"></button>

  <button class="hot menu1" data-order="떡볶이"></button>
  <button class="hot menu2" data-order="오뎅"></button>
  <button class="hot menu3" data-order="로제떡볶이"></button>
  <button class="hot menu4" data-order="김말이"></button>
  <button class="hot menu5" data-order="야채튀김"></button>
  <button class="hot menu6" data-order="고구마튀김"></button>

  <button class="hot ing1" data-ing="떡"></button>
  <button class="hot ing2" data-ing="물"></button>
  <button class="hot ing3" data-ing="생크림"></button>
  <button class="hot ing4" data-ing="고추장"></button>
  <button class="hot ing5" data-ing="고춧가루"></button>
  <button class="hot ing6" data-ing="설탕"></button>

  <button class="hot fry1" data-fry="김말이"></button>
  <button class="hot fry2" data-fry="야채튀김"></button>
  <button class="hot fry3" data-fry="고구마튀김"></button>

  <button class="hot recipe" id="recipe"></button>
  <button class="hot sell" id="sell"></button>
  <button class="hot shop" id="shop"></button>

  <div id="nameOverlay">🌈 무지개 분식</div>
  <div id="moneyOverlay">0원</div>
  <div id="toast"></div>
</div>

<div id="modal" class="hidden">
  <div class="modalCard" id="modalCard"></div>
</div>
<script src="script.js"></script>
</body>
</html>
